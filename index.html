<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotsukotsu Japanese</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9edf2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1524" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-first study desk. One scrolling column between a slim header and a five-cell tab bar;
   every Japanese glyph sits in a genko-yoshi (manuscript paper) cell, stamped with a hanko seal. */
:root{
  --paper:#e9edf2; --surface:#ffffff; --ink:#14213d; --muted:#586581; --line:#cdd5e0;
  --indigo:#27418f; --on-indigo:#ffffff; --seal:#d43d2f; --guide:#b9c4d6;
  --good:#23775a; --good-bg:#dff1e9; --bad:#a12d55; --bad-bg:#f6dfe7; --warn:#96660d;
  --jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0e1524; --surface:#172037; --ink:#e9edf6; --muted:#97a4c0; --line:#2b3857;
    --indigo:#9db8ff; --on-indigo:#0e1524; --seal:#f0604f; --guide:#3a496e;
    --good:#6fd0a6; --good-bg:#153a31; --bad:#f08fb0; --bad-bg:#44182b; --warn:#e3b55a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1524; --surface:#172037; --ink:#e9edf6; --muted:#97a4c0; --line:#2b3857;
  --indigo:#9db8ff; --on-indigo:#0e1524; --seal:#f0604f; --guide:#3a496e;
  --good:#6fd0a6; --good-bg:#153a31; --bad:#f08fb0; --bad-bg:#44182b; --warn:#e3b55a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px}
header .brand{font-family:var(--jp);font-weight:700;font-size:20px;color:var(--ink);text-decoration:none;letter-spacing:.04em}
header .seal{display:flex;align-items:center;gap:6px;border:2px solid var(--seal);color:var(--seal);border-radius:6px;padding:2px 9px;font-weight:700;font-size:13px;text-decoration:none;transform:rotate(-2deg);background:var(--surface)}
header .seal b{font-family:var(--jp);font-size:17px}
main{flex:1;overflow-y:auto;padding:10px 16px 28px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--jp);font-weight:700;font-size:26px;line-height:1.2}
h2{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
main a:not(.task){color:var(--indigo);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.jp{font-family:var(--jp)}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:8px}
nav a b{font-family:var(--jp);font-size:19px;line-height:1;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;font-weight:700}
nav a[aria-current="page"]{color:var(--ink)}
nav a[aria-current="page"] b{background:var(--indigo);color:var(--on-indigo);border-color:var(--indigo)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.task,.lesson{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:inherit;text-align:left;width:100%}
.task .tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;color:transparent}
.task.done .tick{background:var(--good);border-color:var(--good);color:var(--surface)}
.task strong,.lesson strong{display:block}
.go{font-weight:700;color:var(--indigo);font-size:14px;white-space:nowrap}
.lesson .no{flex:none;font-family:var(--jp);font-weight:700;font-size:18px;width:40px;height:40px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center}
.lesson.cur .no{border:2px solid var(--seal);color:var(--seal)}
.lesson.ok .no{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.lesson strong{font-family:var(--jp);font-size:16px;line-height:1.35}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:3px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:92px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.week i{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0;background:var(--indigo);min-height:2px}
.week .zero i{background:var(--line)}
.week .now{color:var(--ink);font-weight:700}
.road{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.road li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.road li:first-child{border-top:0;padding-top:0}
.road .lv{font-family:var(--jp);font-weight:700;font-size:17px;width:44px;height:44px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;color:var(--muted)}
.road .here .lv{border:2px solid var(--seal);color:var(--seal)}
.road strong{display:block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;font-weight:700;min-height:48px}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.btn.wide{width:100%}
.btn:disabled,.chip:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cell{position:relative;background:var(--surface);border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;text-align:center;padding:22px 14px;min-height:200px;
  background-image:linear-gradient(to right,transparent calc(50% - .5px),var(--guide) calc(50% - .5px),var(--guide) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(to bottom,transparent calc(50% - .5px),var(--guide) calc(50% - .5px),var(--guide) calc(50% + .5px),transparent calc(50% + .5px));
  background-size:100% 8px,8px 100%;background-repeat:repeat-y,repeat-x}
.cell .glyph{font-family:var(--jp);font-weight:500;line-height:1.25;overflow-wrap:anywhere;position:relative;background:var(--surface);padding:2px 10px;border-radius:4px}
.cell .tag{position:absolute;top:8px;left:10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface);padding:0 4px;z-index:1}
.cell .stamp{position:absolute;top:8px;right:8px;min-width:30px;height:30px;padding:0 4px;border:2px solid var(--seal);color:var(--seal);border-radius:4px;font-family:var(--jp);font-weight:700;display:grid;place-items:center;font-size:14px;transform:rotate(5deg);background:var(--surface);z-index:1}
.answer{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.answer .kj{font-family:var(--jp);font-size:22px}
.answer .en{font-size:18px;font-weight:700}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades .btn{padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-size:14px}
.grades .btn small{font-weight:500;color:var(--muted);font-size:12px}
.grades .g0{border-color:var(--bad);color:var(--bad)} .grades .g2{border-color:var(--good);color:var(--good)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 8px;min-height:56px;font-size:18px;font-weight:700;overflow-wrap:anywhere}
.opt.jp{font-family:var(--jp);font-size:20px;font-weight:500}
.opt.big{font-family:var(--jp);font-size:44px;font-weight:500;min-height:92px;line-height:1.1}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.verdict{border-radius:10px;padding:12px 14px;font-size:15px}
.verdict.ok{background:var(--good-bg);color:var(--good)} .verdict.no{background:var(--bad-bg);color:var(--bad)}
.verdict b{display:block} .verdict span{color:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;align-items:center}
.tiles.slot{border:1.5px dashed var(--line);border-radius:10px;padding:8px}
.tile{font-family:var(--jp);font-size:20px;border:1.5px solid var(--ink);background:var(--surface);border-radius:6px;padding:8px 12px;min-height:44px}
.note{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 0;border-top:1px dashed var(--line)}
.note:first-child{border-top:0;padding-top:0}
.note:last-child{padding-bottom:0}
.note .n{font-family:var(--jp);font-weight:700;color:var(--seal);font-size:18px;grid-row:span 3}
.note .pat{font-family:var(--jp);font-weight:700;font-size:19px;line-height:1.4}
.note .ex{font-family:var(--jp);font-size:17px;line-height:1.5}
/* kana chart */
.chart{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kc{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0}
.kc b{font-family:var(--jp);font-size:26px;font-weight:500;line-height:1.1}
.kc small{font-size:11px;color:var(--muted)}
.kc.solid{border-color:var(--good);background:var(--good-bg)}
.kc.weak{border-color:var(--bad)}
/* writing pad */
.pad{aspect-ratio:1;width:100%;max-width:420px;margin:0 auto;padding:0;min-height:0}
.pad svg,.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.pad canvas{touch-action:none;border-radius:4px}
svg.ghost path{fill:none;stroke:var(--guide);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
svg.ghost text{font-family:var(--ui);font-size:5px;font-weight:700;fill:var(--seal)}
svg.anim path{fill:none;stroke:var(--indigo);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.strokebox{position:relative;width:132px;height:132px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.strokebox svg{position:absolute;inset:0;width:100%;height:100%}
.ro{display:block;font-family:var(--ui);font-size:13px;line-height:1.4;color:var(--muted);font-style:italic;font-weight:400;letter-spacing:.01em}
.tile .ro{font-size:11px;margin-top:2px}
.tile{display:inline-flex;flex-direction:column;align-items:center}
.conjwrap{overflow-x:auto;margin:0 -4px}
table.conj{width:100%;border-collapse:collapse}
table.conj th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:0 6px 6px;font-family:var(--jp)}
table.conj td{padding:7px 6px;border-top:1px dashed var(--line);vertical-align:top}
table.conj .jp{font-size:17px}
table.conj td small{display:block;font-size:11px;color:var(--muted)}
.mex{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px dashed var(--line)}
.mex:first-of-type{border-top:0;padding-top:0}
.mex .jp{font-size:17px;line-height:1.5}
ul.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--indigo)}
.set label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.set label:first-of-type{border-top:0}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sync.on::before{background:var(--good)}
@media (prefers-reduced-motion:no-preference){.bar i,.week i{transition:width .3s,height .3s}}
</style>
</head>
<body>
<div id="app">
  <header><a class="brand" href="#learn" lang="ja">こつこつ</a><a class="seal" href="#progress" id="seal" aria-label="Progress"><b class="num" id="sealN">0</b> day streak</a></header>
  <main id="view"></main>
  <nav aria-label="Sections">
    <a href="#learn" data-tab="learn"><b>学</b>Learn</a>
    <a href="#kana" data-tab="kana"><b>あ</b>Kana</a>
    <a href="#kanji" data-tab="kanji"><b>漢</b>Kanji</a>
    <a href="#quiz" data-tab="quiz"><b>問</b>Quiz</a>
    <a href="#drill" data-tab="drill"><b>練</b>Drill</a>
  </nav>
</div>
<script>
"use strict";
const PWA=true;
/* ---------- Content ---------- */
const LESSONS={};
const m=(q,en,a,w,why)=>({t:"mc",q,en,a,o:[a,...w],why});
const b=(en,tiles,alt)=>({t:"build",en,tiles,alt:alt||[]});
const L=(n,title,notes,quiz)=>{LESSONS[n]={n,title,notes,quiz:quiz.map(q=>({...q,n}))};};
const X=(n,more,tips)=>{LESSONS[n].more=more;LESSONS[n].tips=tips;};
// Lessons 1-6. Lesson order and grammar scope follow Genki I; explanations, examples and questions are original.
L(1,"X は Y です · questions · の",[
 ["A は B です","わたしは エンジニアです。","I am an engineer. は (read wa) marks the topic; です closes a polite statement."],
 ["〜ですか","がくせいですか。","Are you a student? Adding か turns a statement into a question. No question mark is needed."],
 ["A の B","だいがくの せんせい","A university teacher. の links two nouns; the describing noun comes first. わたしの なまえ: my name."],
 ["Time: number + じ","いま ごご 3じはんです。","It is 3:30 p.m. now. Irregular hours: よじ (4), しちじ (7), くじ (9). はん means half past."],
 ["Dropping the topic","エンジニアです。","Once it is clear who you are talking about, leave わたしは out. Repeating it sounds heavy."]
],[
 m("わたし＿ がくせいです。","I am a student.","は",["を","の","か"],"は marks the topic of the sentence."),
 m("たなかさんは せんせいです＿。","Is Tanaka a teacher?","か",["は","の","を"],"か at the end makes it a question."),
 m("マルコさんは だいがく＿ がくせいです。","Marco is a university student.","の",["は","か","を"],"の links だいがく to がくせい."),
 m("にほんご＿ せんせい","a teacher of Japanese","の",["は","か","です"],"Noun の noun: the first one describes the second."),
 m("いま ＿です。","It is 4 o'clock now.","よじ",["よんじ","しじ","よっじ"],"4 o'clock is irregular: よじ."),
 m("いま ＿です。","It is 7 o'clock now.","しちじ",["ななじ","なのじ","しっじ"],"7 o'clock is しちじ."),
 m("いま ＿です。","It is 9 o'clock now.","くじ",["きゅうじ","ここのじ","くうじ"],"9 o'clock is くじ, not きゅうじ."),
 m("いちじ＿です。","It is half past one.","はん",["ごご","ごぜん","いま"],"はん after the hour means half past."),
 m("A: がくせいですか。 B: はい、＿。","A: Are you a student? B: Yes, I am.","そうです",["いいえ","ですか","なんです"],"はい、そうです: yes, that's right."),
 m("＿ はちじです。","It is 8 p.m.","ごご",["ごぜん","はん","なん"],"ごご is p.m. and comes before the hour."),
 b("I am an engineer.",["わたしは","エンジニア","です"]),
 b("Is Yamada a student?",["やまださんは","がくせい","です","か"]),
 b("My major is English.",["わたしの","せんこうは","えいご","です"]),
 b("My friend is a university teacher.",["ともだちは","だいがくの","せんせい","です"])
]);

L(2,"これ それ あれ · places · も · じゃないです",[
 ["これ · それ · あれ · どれ","それは いくらですか。","How much is that? This one near me, that one near you, that one over there, which one."],
 ["この · その · あの · どの + noun","この とけいは 8000えんです。","This watch is 8,000 yen. These forms must be followed by a noun."],
 ["ここ · そこ · あそこ · どこ","トイレは あそこです。","The restroom is over there. The same three distances, for places."],
 ["だれの + noun","これは だれの かさですか。","Whose umbrella is this? Answer with わたしのです: it's mine."],
 ["Noun も","ともだちも がくせいです。","My friend is a student too. も takes the place of は."],
 ["Noun じゃないです","これは にくじゃないです。","This is not meat. The negative of です. More formal: じゃありません."],
 ["〜ね · 〜よ","おいしいですね。 · これは さかなですよ。","ね asks for agreement (isn't it?). よ tells the listener something they may not know."]
],[
 m("＿は なんですか。","What is that (near you)?","それ",["これ","あれ","どれ"],"それ points at something near the listener."),
 m("＿ かばんは いくらですか。","How much is this bag?","この",["これ","ここ","だれ"],"Before a noun use この, not これ."),
 m("トイレは ＿ですか。","Where is the restroom?","どこ",["どれ","だれ","なん"],"どこ asks about a place."),
 m("これは ＿の くつですか。","Whose shoes are these?","だれ",["なん","どれ","いくら"],"だれの + noun: whose."),
 m("わたしは がくせいです。ともだち＿ がくせいです。","I am a student. My friend is a student too.","も",["は","の","か"],"も means too and replaces は."),
 m("これは さかな＿。","This is not fish.","じゃないです",["です","ですか","のです"],"Noun + じゃないです is the negative of です."),
 m("ぎんこうは ＿です。","The bank is over there (far from both of us).","あそこ",["あれ","あの","そこ"],"あそこ is a place far from both speakers."),
 m("A: これは だれの かさですか。 B: ＿です。","A: Whose umbrella is this? B: It's mine.","わたしの",["わたしは","わたしも","わたし"],"わたしの on its own means mine."),
 m("300","How do you read it?","さんびゃく",["さんひゃく","さんぴゃく","さんせん"],"ひゃく becomes びゃく after さん."),
 m("この ケーキは おいしいです＿。","This cake is tasty, isn't it?","ね",["か","の","も"],"ね invites the listener to agree."),
 b("That is my umbrella.",["それは","わたしの","かさ","です"]),
 b("How much is this book?",["この","ほんは","いくら","ですか"]),
 b("Whose bag is that over there?",["あれは","だれの","かばん","ですか"]),
 b("This is not meat.",["これは","にく","じゃないです"])
]);

L(3,"ます verbs · particles · invitations",[
 ["Verb groups and 〜ます","たべる → たべます · のむ → のみます","Ru-verbs drop る. U-verbs move the last sound to the i-row. Irregular: する → します, くる → きます. かえる is a u-verb: かえります."],
 ["Present tense","あした えいがを みます。","I will watch a movie tomorrow. One tense covers habits and the future. Negative: 〜ません."],
 ["を · で · に · へ","としょかんで ほんを よみます。","を marks the object, で the place of an action, に a destination or clock time, へ (read e) a destination."],
 ["Time words without に","きょう うちに かえります。","きょう, あした, まいにち and いつ take no particle. Clock times and days of the week do: 7じに, にちようびに."],
 ["〜ませんか","ひるごはんを たべませんか。","Won't you have lunch? A polite invitation."],
 ["Frequency","ぜんぜん テレビを みません。","まいにち, よく, ときどき go with a positive verb. あまり and ぜんぜん need a negative one."],
 ["Word order","わたしは きょう としょかんで にほんごを べんきょうします。","Topic, time, place, object, verb. The verb always comes last; the rest is fairly free."]
],[

L(11,"たい · たり · ことが ある",[
 ["〜たい","にほんに いきたいです。","I want to go to Japan. Stem + たい, which conjugates like an い-adjective: いきたくないです, いきたかったです. The object can take を or が."],
 ["Other people's wishes","マリアさんは にほんに いきたいと いっていました。","Maria said she wants to go to Japan. For a third person use と いっていました or stem + たがっています."],
 ["〜たり 〜たり する","しゅうまつは そうじしたり、かいものしたり します。","At weekends I do things like cleaning and shopping. Past short form + り; する carries the tense."],
 ["〜ことが ある","ふじさんに のぼったことが あります。","I have climbed Mt. Fuji. Past short form + ことが あります for experience. Never: 〜ことが ありません."],
 ["A や B","すしや てんぷらを たべました。","I ate sushi, tempura and so on. や lists examples, unlike と, which lists everything."]
],[
 m("わたしは にほんで はたらき＿です。","I want to work in Japan.","たい",["たり","ほしい","たがる"],"Stem + たい: want to do."),
 m("きのうは なにも ＿。","I didn't want to eat anything yesterday.","たべたくなかったです",["たべたいじゃなかったです","たべたくないでした","たべたかったないです"],"たい conjugates like an い-adjective: たくなかった."),
 m("やすみに ほんを ＿、えいがを みたり しました。","On my day off I read books, watched movies and so on.","よんだり",["よんでり","よむたり","よみたり"],"Past short form よんだ + り."),
 m("きょうとに ＿ことが ありますか。","Have you ever been to Kyoto?","いった",["いく","いって","いき"],"Past short form + ことが ある."),
 m("わたしは まだ すしを たべた＿が ありません。","I have never eaten sushi.","こと",["の","もの","とき"],"The fixed pattern is 〜た ことが ある."),
 m("デパートで くつ＿ かばんを かいました。","I bought shoes, a bag and other things at the department store.","や",["も","で","が"],"や lists some examples."),
 m("しゅうまつは テニスを ＿、およいだり します。","At weekends I play tennis, swim and so on.","したり",["しったり","するたり","してり"],"する → した + り."),
 m("こどもの とき、せんせいに ＿です。","As a child I wanted to become a teacher.","なりたかった",["なりたいでした","なりたいかった","なったい"],"たい → たかった in the past."),
 m("のむ → 〜たり form","to drink","のんだり",["のみたり","のったり","のむだり"],"のんだ + り."),
 b("I want to drink cold water.",["つめたい","みずが","のみたい","です"]),
 b("I have never climbed Mt. Fuji.",["ふじさんに","のぼった","ことが","ありません"]),
 b("On Sundays I do things like cleaning and laundry.",["にちようびは","そうじしたり","せんたくしたり","します"],[["にちようびは","せんたくしたり","そうじしたり","します"]])
]);

L(12,"んです · すぎる · ほうが いい · must",[
 ["〜んです","どうしたんですか。 — あたまが いたいんです。","What's wrong? — I have a headache. Short form + んです explains or asks for an explanation. な-adjectives and nouns: なんです."],
 ["〜すぎる","たべすぎました。 · この へやは せますぎます。","I ate too much. This room is too small. Verb stem or adjective stem + すぎる."],
 ["〜ほうが いいです","くすりを のんだほうが いいですよ。","You had better take medicine. Past short form for do; negative short form for don't: のまないほうが いい."],
 ["〜ので","あめなので、うちに います。","It is raining, so I am staying home. Short form + ので, a softer because than から. な-adjectives and nouns: なので."],
 ["〜なければ いけません","あした はやく おきなければ いけません。","I must get up early tomorrow. ない → なければ. Casual: おきなきゃ いけない, or just おきなきゃ."],
 ["〜でしょうか","あしたは はれるでしょうか。","I wonder if it will be sunny tomorrow. A polite, tentative question. Short form + でしょうか; nouns and な-adjectives without だ."]
],[
 m("A: どうしたんですか。 B: おなかが ＿んです。","A: What's wrong? B: My stomach hurts.","いたい",["いたいな","いたいだ","いたく"],"い-adjective short form + んです."),
 m("あしたは テスト＿んです。","(The thing is,) I have a test tomorrow.","な",["だ","の","で"],"Noun + なんです."),
 m("きのう ケーキを ＿すぎました。","I ate too much cake yesterday.","たべ",["たべる","たべて","たべた"],"Verb stem + すぎる."),
 m("この くつは ＿すぎます。","These shoes are too big.","おおき",["おおきい","おおきく","おおきな"],"Drop the い: おおきすぎます."),
 m("かぜですか。はやく うちに ＿ほうが いいですよ。","A cold? You had better go home early.","かえった",["かえって","かえり","かえろう"],"Past short form + ほうが いい."),
 m("よる おそく コーヒーを ＿ほうが いいですよ。","You had better not drink coffee late at night.","のまない",["のまなかった","のんでない","のみない"],"Negative advice uses the present negative: のまない."),
 m("きょうは にちようび＿ので、ぎんこうは やすみです。","Today is Sunday, so the bank is closed.","な",["だ","の","で"],"Noun + なので."),
 m("あした テストが あるから、こんばん ＿。","I have a test tomorrow, so I must study tonight.","べんきょうしなければ いけません",["べんきょうしないと いけます","べんきょうしなくても いけません","べんきょうしては いけません"],"ない → なければ いけません: must."),
 m("いく → casual must","I've got to go","いかなきゃ",["いきなきゃ","いくなきゃ","いってなきゃ"],"いかない → いかなきゃ."),
 b("You had better go to the hospital.",["びょういんに","いった","ほうが","いいですよ"]),
 b("I drank too much yesterday.",["きのう","おさけを","のみ","すぎました"]),
 b("I must return the book today.",["きょう","ほんを","かえさなければ","いけません"],[["ほんを","きょう","かえさなければ","いけません"]])
]);

// Lessons 13-18. Lesson order and grammar scope follow Genki II; explanations, examples and questions are original.
L(13,"Potential verbs · そう (looks) · てみる",[
 ["Potential verbs","たべる → たべられる · いく → いける · のむ → のめる","Can do. Ru-verbs: る → られる. U-verbs: last sound to the e-row + る. する → できる, くる → こられる. They conjugate as ru-verbs; the object takes が or を: にほんごが はなせます。"],
 ["〜し","やすいし、おいしいし、この みせが すきです。","It's cheap, it's tasty, so I like this place. Short form + し lists reasons."],
 ["〜そうです (looks)","この ケーキは おいしそうです。","This cake looks delicious. Adjective stem + そう; いい → よさそう. Negative: おいしくなさそう. Before a noun: おいしそうな ケーキ."],
 ["〜てみる","この ほんを よんでみます。","I will try reading this book. Te-form + みる: do something to see what it is like."],
 ["Noun + なら","さかなは たべられませんが、にくなら たべられます。","I can't eat fish, but meat I can. なら singles out one item in contrast to others."],
 ["Period に frequency","1しゅうかんに 3かい うんどうします。","I exercise three times a week."]
],[
 m("およぐ → potential","to swim","およげる",["およがれる","およぎられる","およげられる"],"U-verb: ぐ → げ + る."),
 m("くる → potential","to come","こられる",["くられる","きられる","くれる"],"Irregular: こられる."),
 m("する → potential","to do","できる",["すられる","しられる","せる"],"Irregular: できる."),
 m("わたしは かんじ＿ よめません。","I can't read kanji.","が",["に","で","へ"],"With potential verbs the object takes が (or を)."),
 m("この ケーキは ＿そうですね。","This cake looks delicious, doesn't it?","おいし",["おいしい","おいしく","おいしな"],"Drop い before そう."),
 m("いい → looks good","good","よさそう",["いそう","いいそう","よそう"],"Irregular: よさそう."),
 m("この くつを ＿みても いいですか。","May I try these shoes on?","はいて",["はく","はき","はいた"],"Te-form + みる: try doing."),
 m("A: スポーツを しますか。 B: テニス＿ しますが、ほかの スポーツは しません。","A: Do you play sports? B: Tennis, yes, but no other sports.","なら",["しか","より","まで"],"なら contrasts one item with the rest."),
 m("1しゅうかん＿ 2かい アルバイトを します。","I work part-time twice a week.","に",["で","を","が"],"Period に number of times."),
 m("この アパートは えきに ちかい＿、やすい＿、とても いいです。","This apartment is near the station and cheap, so it's very good.","し",["て","で","と"],"Short form + し lists reasons."),
 b("I can't eat sashimi.",["わたしは","さしみが","たべられ","ません"]),
 b("That movie looks interesting.",["あの","えいがは","おもしろ","そうです"]),
 b("I'll try cooking Japanese food.",["にほんの","りょうりを","つくって","みます"])
]);

L(14,"ほしい · giving and receiving · かもしれません",[
 ["X が ほしいです","あたらしい パソコンが ほしいです。","I want a new computer. ほしい is an い-adjective and the wanted thing takes が. For others: ほしがっています."],
 ["〜かもしれません","あしたは あめかもしれません。","It might rain tomorrow. Short form + かもしれません; nouns and な-adjectives without だ."],
 ["あげる · くれる · もらう","ともだちが わたしに ほんを くれました。 · わたしは ともだちに ほんを もらいました。","あげる: give to someone else. くれる: someone gives to me (or my side). もらう: receive, with the giver marked by に or から."],
 ["〜たら どうですか","せんせいに きいたら どうですか。","Why don't you ask the teacher? Past short form + ら どうですか gives a suggestion."],
 ["Number + も · number + しか + negative","ねこが 5ひきも います。 · 100えんしか ありません。","As many as five cats. Only 100 yen. も stresses a large amount; しか with a negative stresses a small one."]
],[
 m("わたしは あたらしい パソコン＿ ほしいです。","I want a new computer.","が",["に","で","へ"],"The wanted thing takes が."),
 m("たなかさんは あした ＿かもしれません。","Tanaka might not come tomorrow.","こない",["きません","こなく","きない"],"Short form + かもしれません."),
 m("あしたは ＿かもしれません。","It might rain tomorrow.","あめ",["あめだ","あめな","あめの"],"Nouns go directly before かもしれません."),
 m("たんじょうびに ともだちが わたしに とけいを ＿。","My friend gave me a watch for my birthday.","くれました",["あげました","もらいました","あげます"],"Someone gives to me: くれる."),
 m("わたしは ははに はなを ＿。","I gave my mother flowers.","あげました",["くれました","くれます","もらわれました"],"I give to someone: あげる."),
 m("わたしは あねに ほんを ＿。","I got a book from my older sister.","もらいました",["くれました","くれます","あげられました"],"I receive: もらう, giver marked with に."),
 m("あたまが いたいんですか。くすりを ＿ どうですか。","You have a headache? Why don't you take some medicine?","のんだら",["のんで","のむたら","のみたら"],"Past short form + ら どうですか."),
 m("さいふに 500えん＿ ありません。","I have only 500 yen in my wallet.","しか",["を","で","に"],"しか + negative: only."),
 m("きのう パーティーに ひとが 100にん＿ きました。","As many as 100 people came to the party yesterday.","も",["しか","で","に"],"Number + も: as many as."),
 b("I want a new bag.",["わたしは","あたらしい","かばんが","ほしいです"]),
 b("My friend gave me chocolate.",["ともだちが","わたしに","チョコレートを","くれました"],[["ともだちが","チョコレートを","わたしに","くれました"]]),
 b("Why don't you ask the teacher?",["せんせいに","きいたら","どうですか"])
]);

L(15,"Volitional · ておく · clauses before nouns",[
 ["Volitional form","たべる → たべよう · いく → いこう · のむ → のもう","Casual let's. Ru-verbs: る → よう. U-verbs: last sound to the o-row + う. する → しよう, くる → こよう."],
 ["Volitional + と おもっています","らいねん りゅうがくしようと おもっています。","I am planning to study abroad next year. と おもいます is a decision made on the spot; と おもっています is a plan you already have."],
 ["〜ておく","りょこうの まえに ホテルを よやくしておきます。","I will book the hotel before the trip. Te-form + おく: do something in advance. Casual: よやくしとく."],
 ["Clauses before nouns","ともだちが つくった ケーキは おいしかったです。","The cake my friend made was delicious. A short-form sentence describes the noun after it; its subject takes が (or の), not は."]
],[
 m("のむ → volitional","to drink","のもう",["のみよう","のまおう","のめよう"],"U-verb: む → も + う."),
 m("たべる → volitional","to eat","たべよう",["たべろう","たべおう","たべるよう"],"Ru-verb: る → よう."),
 m("くる → volitional","to come","こよう",["くよう","きよう","こおう"],"Irregular: こよう."),
 m("する → volitional","to do","しよう",["すよう","しおう","するよう"],"Irregular: しよう."),
 m("かう → volitional","to buy","かおう",["かよう","かうよう","かいおう"],"U-verb: う → お + う."),
 m("らいねん にほんに ＿と おもっています。","I am planning to go to Japan next year.","いこう",["いきよう","いって","いけよう"],"Volitional + と おもっています."),
 m("あした テストが あるから、こんばん ＿おきます。","I have a test tomorrow, so I'll study tonight to be ready.","べんきょうして",["べんきょうし","べんきょうする","べんきょうした"],"Te-form + おく: in preparation."),
 m("これは わたし＿ かいた てがみです。","This is the letter I wrote.","が",["は","を","で"],"Inside a describing clause the subject takes が."),
 m("きのう ＿ えいがは おもしろかったです。","The movie I saw yesterday was interesting.","みた",["みて","みました","みる"],"A short form goes before the noun; きのう calls for the past."),
 b("I think I'll study abroad next year.",["らいねん","りゅうがくしようと","おもって","います"]),
 b("I'll buy the tickets in advance.",["きっぷを","かって","おきます"]),
 b("The cake my mother made is delicious.",["ははが","つくった","ケーキは","おいしいです"])
]);

L(16,"Favors · ていただけませんか · とき",[
 ["〜てあげる · 〜てくれる · 〜てもらう","ともだちが しゅくだいを てつだってくれました。","My friend helped me with my homework. Te-form + the giving verbs describes doing favors. てもらう: わたしは ともだちに てつだってもらいました。"],
 ["〜ていただけませんか","もう いちど いっていただけませんか。","Could you please say it once more? Very polite. Less formal: 〜てくれませんか; casual: 〜てくれない？"],
 ["〜と いい","あした はれると いいですね。","I hope it is sunny tomorrow. Short present + と いいですね for others; + と いいんですが for your own hopes."],
 ["〜とき","にほんに いくとき、かばんを かいました。 · にほんに いったとき、おてらを みました。","Dictionary form: the main event happens before or while the とき action is unfinished. た-form: after it is done. Nouns: こどもの とき; な-adjectives: ひまな とき."],
 ["〜て すみませんでした","おそく なって すみませんでした。","I am sorry for being late. Te-form gives what you apologize for. Negative: 〜なくて すみませんでした."]
],[
 m("ともだちが えきまで ＿くれました。","My friend took me to the station.","おくって",["おくり","おくる","おくった"],"Te-form + くれる: someone does me a favor."),
 m("わたしは せんせいに すいせんじょうを かいて＿。","I had my teacher write a letter of recommendation.","もらいました",["くれました","あげました","やりました"],"I receive the favor: てもらう, doer marked with に."),
 m("わたしは おとうとに ほんを よんで＿。","I read a book to my younger brother.","あげました",["くれました","くださいました","いただきました"],"I do the favor: てあげる."),
 m("すみません、もう いちど ＿ いただけませんか。","Excuse me, could you say it once more?","いって",["いう","いい","いった"],"Te-form + いただけませんか."),
 m("あした、いい てんき＿と いいですね。","I hope the weather is good tomorrow.","だ",["な","の","で"],"A noun needs だ before と いい."),
 m("にほんに ＿とき、パスポートを とりました。","I got a passport when I was going to Japan (before leaving).","いく",["いった","いって","いこう"],"The passport came before the trip, so the dictionary form."),
 m("にほんに ＿とき、おてらを たくさん みました。","When I went to Japan, I saw many temples (once there).","いった",["いく","いって","いこう"],"Seeing temples happened after arriving, so the た-form."),
 m("こども＿ とき、よく この こうえんで あそびました。","When I was a child, I often played in this park.","の",["な","だ","に"],"Noun の とき."),
 m("おそく ＿ すみませんでした。","I am sorry for being late.","なって",["なる","なった","なり"],"Te-form + すみませんでした."),
 b("My friend lent me an umbrella.",["ともだちが","かさを","かして","くれました"]),
 b("Could you please teach me kanji?",["かんじを","おしえて","いただけませんか"]),
 b("I hope it will be sunny tomorrow.",["あした","はれると","いい","ですね"])
]);

L(17,"そうです (hearsay) · たら · みたい",[
 ["〜そうです (I hear)","あしたは あめだそうです。","I hear it will rain tomorrow. Short form + そうです. Compare ふりそうです (looks like it will rain). Source: 〜に よると."],
 ["〜って","あした テストが あるって。","I heard there's a test tomorrow. The casual way to pass on what you heard."],
 ["〜たら","じかんが あったら、いきます。 · うちに かえったら、でんわします。","If I have time, I'll go. When I get home, I'll call. Past short form + ら. Adjectives: やすかったら; nouns: あめだったら."],
 ["〜なくても いいです","あしたは こなくても いいです。","You don't have to come tomorrow. ない → なくて + も いい."],
 ["〜みたいです","あの ひとは がくせいみたいです。","That person seems to be a student. Noun or short form + みたい, a judgement from what you see."],
 ["〜まえに · 〜てから","ねるまえに、はを みがきます。 · しゅくだいを してから、あそびます。","Dictionary form + まえに: before. Te-form + から: after."]
],[
 m("てんきよほうに よると、あしたは ゆきが ＿そうです。","According to the forecast, it will snow tomorrow.","ふる",["ふり","ふって","ふろう"],"Hearsay takes the short form. ふりそう would mean it looks like snow."),
 m("たなかさんは らいげつ けっこんする＿。","(casual) I heard Tanaka is getting married next month.","って",["て","っと","だって"],"Short form + って."),
 m("じかんが ＿、えいがを みに いきます。","If I have time, I will go to see a movie.","あったら",["あるたら","あれたら","あって"],"あった + ら."),
 m("＿、かいます。","If it is cheap, I will buy it.","やすかったら",["やすいたら","やすいだったら","やすくたら"],"い-adjective: やすかった + ら."),
 m("あしたは やすみだから、はやく ＿も いいです。","Tomorrow is a day off, so I don't have to get up early.","おきなくて",["おきないで","おきなく","おきなければ"],"なくても いい: need not."),
 m("あの ひとは にほんじん＿です。","That person seems to be Japanese.","みたい",["そう","のみたい","だみたい"],"Noun + みたい, with nothing in between."),
 m("ごはんを ＿ まえに、てを あらいます。","I wash my hands before eating.","たべる",["たべた","たべて","たべ"],"Always the dictionary form before まえに."),
 m("しゅくだいを ＿から、テレビを みます。","I watch TV after doing my homework.","して",["しって","すて","しに"],"Te-form + から: after doing."),
 m("しずかだ → I hear it is quiet","quiet","しずかだそうです",["しずかそうです","しずかなそうです","しずかのそうです"],"Hearsay keeps だ. しずかそうです means it looks quiet."),
 b("I hear that restaurant is delicious.",["あの レストランは","おいしい","そうです"]),
 b("If it rains, I won't go out.",["あめが","ふったら","でかけません"]),
 b("You don't have to come tomorrow.",["あしたは","こなくても","いいです"])
]);

L(18,"Transitive pairs · てしまう · と · ながら",[
 ["Transitive and intransitive pairs","ドアを あけます。 · ドアが あきます。","I open the door. The door opens. Pairs: あける/あく, しめる/しまる, いれる/はいる, だす/でる, つける/つく, けす/きえる, こわす/こわれる, おとす/おちる."],
 ["Intransitive + ています","まどが あいています。","The window is open. Describes the state left by a change."],
 ["〜てしまう","さいふを なくしてしまいました。","I lost my wallet (unfortunately). Also: finish completely. Casual: てしまう → ちゃう, でしまう → じゃう."],
 ["〜と","この ボタンを おすと、ドアが あきます。","When you press this button, the door opens. Short present + と for automatic results."],
 ["〜ながら","おんがくを ききながら、べんきょうします。","I study while listening to music. Verb stem + ながら; the main action comes last."],
 ["〜ば よかったです","もっと べんきょうすれば よかったです。","I should have studied more. ば-form + よかった expresses regret. Negative: 〜なければ よかった."]
],[
 m("さむいですね。まどを ＿ましょうか。","It's cold. Shall I close the window?","しめ",["しまり","しまって","しめり"],"Someone closes it: transitive しめる."),
 m("あ、ドアが ＿います。","Oh, the door is open.","あいて",["あけて","あきて","あけって"],"A state: intransitive あく + ています."),
 m("でんき＿ きえました。","The light went off.","が",["を","に","で"],"Intransitive verbs take が."),
 m("でんきを ＿ ください。","Please turn on the light.","つけて",["ついて","つきて","つけって"],"を calls for the transitive つける."),
 m("コーヒーに さとうを ＿ました。","I put sugar in my coffee.","いれ",["はいり","はいって","いり"],"を calls for the transitive いれる."),
 m("しゅくだいを わすれて＿。","I forgot my homework (to my regret).","しまいました",["おきました","みました","ありました"],"てしまう: regret or completion."),
 m("この ボタンを ＿と、ドアが あきます。","When you press this button, the door opens.","おす",["おして","おした","おそう"],"Short present + と."),
 m("テレビを ＿ながら、ごはんを たべます。","I eat while watching TV.","み",["みて","みる","みた"],"Verb stem + ながら."),
 m("もっと はやく ＿ば よかったです。","I should have got up earlier.","おきれ",["おきる","おきて","おけ"],"おきる → おきれば."),

// Lessons 19-23.
L(19,"Honorific speech · はず · てよかった",[
 ["Honorific verbs","せんせいは あした いらっしゃいます。","The teacher will come tomorrow. Special verbs raise the person who acts: いらっしゃる (いく, くる, いる), めしあがる (たべる, のむ), おっしゃる (いう), ごらんになる (みる), なさる (する), くださる (くれる), おやすみになる (ねる). Never use them for yourself."],

 ["お + stem + ください","しょうしょう おまちください。","Please wait a moment. A respectful request, common in shops and announcements."],
 ["〜てくれて ありがとう","てつだってくれて ありがとう。","Thank you for helping me. Politer: てつだってくださって ありがとうございました。"],

 ["〜はずです","バスは もうすぐ くる はずです。","The bus should come soon. Short form + はず for what you expect on good grounds. な-adjective + な, noun + の."]
],[

 b("The teacher is reading a newspaper. (honorific)",["せんせいは","しんぶんを","よんで","いらっしゃいます"]),

L(20,"Humble speech · embedded questions · やすい / にくい",[
 ["Extra-modest expressions","たなかと もうします。 · あした まいります。","Formal verbs for your own side: おります (いる), まいります (いく, くる), もうします (いう), いたします (する), いただきます (たべる, のむ), ございます (ある), でございます (です)."],
 ["Humble: お + stem + する","にもつを おもちします。","I will carry your luggage. For something you do for a superior. Special verbs: いただく (もらう), さしあげる (あげる), うかがう (きく, たずねる)."],
 ["〜ないで","あさごはんを たべないで、がっこうに いきました。","I went to school without eating breakfast."],
 ["Questions inside sentences","たなかさんが いつ くるか しっていますか。 · いくか どうか わかりません。","Short form + か for question-word questions; + か どうか for yes/no questions. だ is usually dropped: なにか わかりません."],
 ["Name と いう item","「さくら」と いう みせ","A shop called Sakura. Introduces something the listener may not know."],
 ["Stem + やすい · にくい","この ペンは かきやすいです。 · この かんじは おぼえにくいです。","Easy to write with. Hard to remember. Both conjugate as い-adjectives."]
],[
 m("はじめまして。たなかと ＿。","How do you do. My name is Tanaka. (modest)","もうします",["おっしゃいます","いいになります","もうされます"],"もうします is the modest いいます."),
 m("いく → extra-modest","to go","まいります",["いらっしゃいます","うかがわれます","おいきます"],"まいります for your own going or coming."),
 m("ある → extra-modest","to exist","ございます",["おります","いたします","まいります"],"ございます."),
 m("にもつを ＿しましょうか。","Shall I carry your luggage? (humble)","おもち",["おもって","もち","おもつ"],"お + stem + する."),
 m("わたしは せんせいに ほんを ＿。","I received a book from my teacher. (humble)","いただきました",["くださいました","もうしました","めしあがりました"],"いただく is the humble もらう."),
 m("きのうは ＿ないで、べんきょうしました。","Yesterday I studied without sleeping.","ね",["ねる","ねて","ねなく"],"ねない + で: without sleeping."),
 m("たなかさんが なにを たべた＿ しっていますか。","Do you know what Tanaka ate?","か",["かどうか","と","の"],"With a question word, use か alone."),
 m("あした あめが ふる＿ わかりません。","I don't know whether it will rain tomorrow.","かどうか",["と","のを","から"],"Yes/no question inside a sentence: か どうか."),
 m("「トトロ」＿ えいがを みました。","I saw a movie called Totoro.","という",["をいう","にいう","がいう"],"Name と いう item."),
 m("この かんじは ＿にくいです。","This kanji is hard to write.","かき",["かく","かいて","かけ"],"Verb stem + にくい."),
 b("I don't know where the station is.",["えきが","どこに あるか","わかりません"]),
 b("This book is easy to read.",["この","ほんは","よみやすい","です"]),
 b("I went out without taking an umbrella.",["かさを","もたないで","でかけました"])
]);

L(21,"Passive · てある · あいだに · てほしい",[
 ["Passive verbs","たべる → たべられる · よむ → よまれる · とる → とられる","Ru-verbs: る → られる. U-verbs: last sound to the a-row + れる (う → われる). する → される, くる → こられる."],
 ["Passive sentences","わたしは ともだちに わらわれました。 · わたしは どろぼうに さいふを とられました。","I was laughed at by my friend. I had my wallet stolen by a thief. The affected person is the topic, the doer takes に; often implies annoyance."],
 ["〜てある","まどが あけてあります。","The window has been opened (by someone, on purpose). Transitive te-form + ある, with が. Compare あいています, which only describes the state."],
 ["〜あいだに","るすの あいだに ともだちが きました。","A friend came while I was out. Noun の or 〜ている + あいだに: something happens within that period."],
 ["Adjective + する","へやを きれいに します。 · おとを おおきく します。","Make the room clean. Turn the sound up. い → く する, な → に する. Noun に する: decide on (コーヒーに します)."],
 ["〜てほしい","ともだちに てつだってほしいです。","I want my friend to help me. Person に te-form + ほしい. Negative: 〜ないで ほしい."]
],[
 m("よむ → passive","to read","よまれる",["よめられる","よみられる","よまられる"],"U-verb: む → ま + れる."),
 m("する → passive","to do","される",["しられる","すられる","させる"],"Irregular: される."),
 m("とる → passive","to take","とられる",["とれる","とらせる","とりられる"],"U-verb: る → ら + れる."),
 m("わたしは でんしゃの なかで あしを ＿。","Someone stepped on my foot on the train.","ふまれました",["ふみました","ふませました","ふめました"],"I am the one affected: passive ふまれる."),
 m("わたしは せんせい＿ しかられました。","I was scolded by the teacher.","に",["を","が","で"],"The doer in a passive sentence takes に."),
 m("れいぞうこに ビールが いれて＿。","Beer has been put in the fridge.","あります",["います","おきます","しまいます"],"Thing が transitive te-form + ある."),
 m("わたしが るすの ＿、だれか きましたか。","Did anyone come while I was out?","あいだに",["ながら","うちで","ときで"],"Noun の あいだに: during."),
 m("へやを きれい＿ しました。","I made the room clean.","に",["く","で","な"],"な-adjective + に する."),
 m("テレビの おとを ＿ してください。","Please turn the TV down.","ちいさく",["ちいさいに","ちいさに","ちいさくて"],"い-adjective: く する."),
 m("わたしは ともだちに てつだって＿。","I want my friend to help me.","ほしいです",["たいです","あげたいです","ほしがります"],"Te-form + ほしい: want someone to do."),
 b("I had my wallet stolen by a thief.",["わたしは","どろぼうに","さいふを","とられました"],[["わたしは","さいふを","どろぼうに","とられました"]]),
 b("The window has been opened.",["まどが","あけて","あります"]),
 b("I want you to come too.",["あなたにも","きて","ほしい","です"])
]);

L(22,"Causative · なさい · ば · のに",[
 ["Causative verbs","たべる → たべさせる · いく → いかせる · よむ → よませる","Make or let someone do. Ru-verbs: る → させる. U-verbs: last sound to the a-row + せる (う → わせる). する → させる, くる → こさせる."],
 ["Causative sentences","せんせいは がくせいに かんじを かかせました。","The teacher made the students write kanji. The one made to act takes に. Let: causative te-form + あげる / くれる. 〜させてください: please let me."],
 ["Stem + なさい","はやく ねなさい。","Go to bed early. A command from parents or teachers."],
 ["〜ば","くすりを のめば、よく なります。","If you take the medicine, you'll get better. Ru-verbs: れば. U-verbs: e-row + ば. する → すれば, くる → くれば. い-adjectives: やすければ. Negative: 〜なければ."],
 ["〜のに","べんきょうしたのに、テストが できませんでした。","Although I studied, I couldn't do the test. Short form + のに, with surprise or frustration. な-adjectives and nouns: なのに."],
 ["〜の ような · 〜の ように","ゆめの ような はなし · とりの ように とびたい","A story like a dream. I want to fly like a bird. ような before nouns, ように before verbs and adjectives."]
],[
 m("よむ → causative","to read","よませる",["よめさせる","よまされる","よみさせる"],"U-verb: む → ま + せる."),
 m("くる → causative","to come","こさせる",["くさせる","きさせる","こらせる"],"Irregular: こさせる."),
 m("ははは こどもに やさいを ＿。","The mother made her child eat vegetables.","たべさせました",["たべられました","たべさました","たべせました"],"Ru-verb: たべる → たべさせる."),
 m("すみません、きょうは はやく ＿ください。","Excuse me, please let me go home early today.","かえらせて",["かえられて","かえさせて","かえりさせて"],"Causative te-form + ください: let me."),
 m("もう おそいから、はやく ＿なさい。","It's late, so go to bed quickly.","ね",["ねる","ねて","ねろ"],"Verb stem + なさい."),
 m("いく → ば-form","to go","いけば",["いくば","いかば","いきれば"],"U-verb: く → け + ば."),
 m("やすい → ば-form","cheap","やすければ",["やすいば","やすくば","やすけば"],"い-adjective: い → ければ."),
 m("たくさん ねた＿、まだ ねむいです。","Although I slept a lot, I am still sleepy.","のに",["ので","から","し"],"のに: despite."),
 m("きょうは にちようび＿のに、しごとが あります。","Although today is Sunday, I have work.","な",["だ","の","で"],"Noun + なのに."),
 m("あの ひとは モデル＿ ような ふくを きています。","That person is wearing clothes like a model's.","の",["な","に","が"],"Noun の ような + noun."),
 b("The teacher made the students write an essay.",["せんせいは","がくせいに","さくぶんを","かかせました"]),
 b("If you take this medicine, you'll get better.",["この くすりを","のめば","よく","なります"]),
 b("Although I studied, I couldn't do the test.",["べんきょうしたのに","テストが","できません","でした"])

],[

 m("あめが ＿も、しあいを します。","Even if it rains, we will play the match.","ふって",["ふる","ふった","ふり"],"Te-form + も: even if."),

 m("あした あめ＿、でかけます。","Even if it rains tomorrow, I will go out.","でも",["ても","だも","なも"],"Noun + でも."),

const CV=[["たべる","eat","ru"],["みる","see","ru"],["おきる","get up","ru"],["のむ","drink","u"],["かく","write","u"],["およぐ","swim","u"],["はなす","speak","u"],["まつ","wait","u"],["かう","buy","u"],["あそぶ","play","u"],["しぬ","die","u"],["かえる","return","u"],["いく","go","u"],["する","do","irr"],["くる","come","irr"]];
const CA=[["たかい","expensive","i"],["おもしろい","interesting","i"],["いい","good","i"],["しずか","quiet","na"],["きれい","pretty, clean","na"],["げんき","lively, well","na"]];
const RA={う:"わ",く:"か",ぐ:"が",す:"さ",つ:"た",ぬ:"な",ぶ:"ば",む:"ま",る:"ら"},RI={う:"い",く:"き",ぐ:"ぎ",す:"し",つ:"ち",ぬ:"に",ぶ:"び",む:"み",る:"り"},RE={う:"え",く:"け",ぐ:"げ",す:"せ",つ:"て",ぬ:"ね",ぶ:"べ",む:"め",る:"れ"},RO_={う:"お",く:"こ",ぐ:"ご",す:"そ",つ:"と",ぬ:"の",ぶ:"ぼ",む:"も",る:"ろ"},RTE={う:"って",つ:"って",る:"って",む:"んで",ぶ:"んで",ぬ:"んで",く:"いて",ぐ:"いで",す:"して"};
const IRR={
  "する":{masu:"します",te:"して",nai:"しない",pot:"できる",vol:"しよう",ba:"すれば",pass:"される",caus:"させる",cp:"させられる"},
  "くる":{masu:"きます",te:"きて",nai:"こない",pot:"こられる",vol:"こよう",ba:"くれば",pass:"こられる",caus:"こさせる",cp:"こさせられる"}};
function conj(v,g,f){
  const st=v.slice(0,-1),l=v.slice(-1),ir=IRR[v];
  const masu=ir?ir.masu:g==="ru"?st+"ます":st+RI[l]+"ます";
  const te=ir?ir.te:g==="ru"?st+"て":v==="いく"?"いって":st+RTE[l];
  const ta=te.slice(0,-1)+(te.endsWith("で")?"だ":"た");
  const nai=ir?ir.nai:g==="ru"?st+"ない":st+RA[l]+"ない";
  const ms=masu.slice(0,-2);
  const F={masu,masen:ms+"ません",mashita:ms+"ました",masendeshita:ms+"ませんでした",te,ta,nai,nakatta:nai.slice(0,-1)+"かった",
    tai:ms+"たい",tari:ta+"り",nakereba:nai.slice(0,-1)+"ければ",tara:ta+"ら"};
  if(F[f])return F[f];
  if(ir)return ir[f];
  if(g==="ru")return st+{pot:"られる",vol:"よう",ba:"れば",pass:"られる",caus:"させる",cp:"させられる"}[f];
  return {pot:st+RE[l]+"る",vol:st+RO_[l]+"う",ba:st+RE[l]+"ば",pass:st+RA[l]+"れる",caus:st+RA[l]+"せる",cp:l==="す"?st+"させられる":st+RA[l]+"される"}[f];
}
function aconj(a,g,f){
  if(g==="na")return a+{pres:"です",presneg:"じゃないです",past:"でした",pastneg:"じゃなかったです",adjte:"で"}[f];
  const st=a==="いい"?"よ":a.slice(0,-1);
  return f==="pres"?a+"です":st+{presneg:"くないです",past:"かったです",pastneg:"くなかったです",adjte:"くて"}[f];
}
const FL={masu:"〜ます",masen:"〜ません",mashita:"〜ました",masendeshita:"〜ませんでした",te:"〜て",ta:"〜た",nai:"〜ない",nakatta:"〜なかった",tai:"〜たい",tari:"〜たり",nakereba:"〜なければ",tara:"〜たら",pot:"Potential",vol:"Volitional",ba:"〜ば",pass:"Passive",caus:"Causative",cp:"Causative-passive",pres:"Present",presneg:"Negative",past:"Past",pastneg:"Past negative",adjte:"〜て"};
const TABLES={3:[["Polite present",["masu","masen"]]],4:[["Polite past",["mashita","masendeshita"]]],5:[["Adjectives: present",["pres","presneg"],1],["Adjectives: past",["past","pastneg"],1]],6:[["Te-form",["te"]]],7:[["Adjectives: te-form",["adjte"],1]],8:[["Short present negative",["nai"]]],9:[["Short past",["ta","nakatta"]]],11:[["〜たい and 〜たり",["tai","tari"]]],12:[["Must: 〜なければ いけません",["nakereba"]]],13:[["Potential",["pot"]]],15:[["Volitional",["vol"]]],17:[["〜たら",["tara"]]],21:[["Passive",["pass"]]],22:[["Causative and 〜ば",["caus","ba"]]],23:[["Causative-passive",["cp"]]]};
const GL={ru:"ru-verb",u:"u-verb",irr:"irregular",i:"い-adjective",na:"な-adjective"};
function tableHtml([title,forms,adj]){
  const rows=(adj?CA:CV).map(([w,en,g])=>{
    const note=w==="かえる"?"u-verb, looks like ru":w==="いく"?"u-verb, irregular て":w==="いい"?"い-adj, irregular":GL[g];
    return `<tr><td><span class="jp" lang="ja">${w}${g==="na"?"(な)":""}</span>${RO(w)}<small>${en} · ${note}</small></td>${forms.map(f=>{const x=adj?aconj(w,g,f):conj(w,g,f);return `<td><span class="jp" lang="ja">${x}</span>${RO(x)}</td>`;}).join("")}</tr>`;}).join("");
  return `<section class="card stack"><h2>${title}</h2><div class="conjwrap"><table class="conj"><thead><tr><th>Dictionary form</th>${forms.map(f=>`<th lang="ja">${FL[f]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
const LAYOUT_BASE="あいうえお|かきくけこ|さしすせそ|たちつてと|なにぬねの|はひふへほ|まみむめも|や　ゆ　よ|らりるれろ|わ　　　を|ん　　　　";
const LAYOUT_VOICED="がぎぐげご|ざじずぜぞ|だぢづでど|ばびぶべぼ|ぱぴぷぺぽ";
const STAGES=[["N5","Genki I · lessons 1 to 12","about 800 words, 145 kanji in this course"],["N4","Genki II · lessons 13 to 23","about 1,500 words, 317 kanji in this course"],["N3","Quartet 1 or Tobira","about 3,700 words, 650 kanji"],["N2","Quartet 2 · Shin Kanzen Master","about 6,000 words, 1,000 kanji"],["職","Keigo, business Japanese, technical vocabulary","working in Japanese"]];

/* ---------- State ---------- */
const KEY="kotsukotsu.v1";
const blank=()=>({v:2,srs:{},cstat:{},gram:{},studied:{},days:{},set:{npd:5,lesson:3,romaji:true},t:0});
function norm(s){
  const d=blank();s=s&&typeof s==="object"?s:{};
  const o={...d,...s,set:{...d.set,...(s.set||{})}};
  if(s.kana&&!s.cstat)o.cstat=s.kana;           // v1 name
  delete o.kana;delete o.set.units;
  if(s.v!==2&&!(s.set&&s.set.lesson))o.set.npd=5; // v1 default was sized for vocabulary
  o.srs=Object.fromEntries(Object.entries(o.srs||{}).filter(([id])=>CARD[id]));
  o.set.lesson=Math.min(NL,Math.max(1,+o.set.lesson||3));o.v=2;
  return o;
}
let S=blank();
try{const raw=localStorage.getItem(KEY);if(raw)S=norm(JSON.parse(raw));}catch(e){}
const dayNow=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);};
const D=(n=dayNow())=>(S.days[n]||(S.days[n]={r:0,n:0,g:0,k:0}));
const peek=n=>S.days[n]||{r:0,n:0,g:0,k:0};
const total=d=>d.r+d.g+d.k;

let sync="local",ref=null,saving=false,dirty=false,timer=null;
function save(){
  S.t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(ref){clearTimeout(timer);timer=setTimeout(push,1500);}
}
async function push(){
  if(!ref)return;if(saving){dirty=true;return;}
  saving=true;
  try{await ref.set({blob:JSON.stringify(S),t:S.t});sync="account";}catch(e){sync="local";}
  saving=false;showSync();
  if(dirty){dirty=false;push();}
}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const doc=db.doc("data/users/"+id+"/progress");
    const snap=await Promise.race([doc.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    ref=doc;sync="account";
    if(snap.exists){
      const remote=norm(JSON.parse(snap.data().blob));
      if((remote.t||0)>(S.t||0)){S=remote;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}resetSessions();render();}
      else if((S.t||0)>(remote.t||0))push();
    }else if(S.t)push();
  }catch(e){sync="local";}
  showSync();
}
function showSync(){const el=$("sync");if(!el)return;el.className="sync"+(sync==="account"?" on":"");el.textContent=sync==="account"?"Progress saved to your account":"Progress saved on this device only";}

/* ---------- Spaced repetition ---------- */
function grade(s,g,t){
  s=s?{...s}:{d:t,i:0,e:2.5,r:0,l:0};
  if(g===0){if(s.i>0)s.l++;s.e=Math.max(1.3,s.e-0.2);s.i=0;s.d=t;}
  else if(s.i===0){s.i=g===3?4:1;s.d=t+s.i;}
  else{const k=g===1?1.2:g===2?s.e:s.e*1.3;s.i=Math.max(s.i+1,Math.round(s.i*k));if(g===1)s.e=Math.max(1.3,s.e-0.15);if(g===3)s.e+=0.15;s.d=t+s.i;}
  s.e=Math.round(s.e*100)/100;s.r++;return s;
}
const deck=()=>KANJI.filter(c=>c.l<=S.set.lesson);
function counts(extra=0){
  const t=dayNow(),dk=deck();
  const due=dk.filter(c=>S.srs[c.id]&&S.srs[c.id].d<=t).sort((a,b)=>S.srs[a.id].d-S.srs[b.id].d);
  const unseen=dk.filter(c=>!S.srs[c.id]);
  return {due,fresh:unseen.slice(0,Math.max(0,S.set.npd+extra-peek(t).n)),left:unseen.length};
}
const learned=()=>Object.keys(S.srs).filter(id=>CARD[id]&&S.srs[id].i>0).length;
function streak(){let t=dayNow(),n=0;if(!total(peek(t)))t--;while(total(peek(t))>0){n++;t--;}return n;}
const fmt=i=>i<=0?"today":i===1?"1 day":i<30?i+" days":Math.round(i/30)+" mo";
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- Sessions (in memory) ---------- */
let cs,lv,kv,qv,dv,wr;
function resetSessions(){
  cs={queue:null,shown:false,extra:0,day:dayNow()};
  lv={open:null};kv={set:"hira"};wr=null;
  qv={set:"hira",voiced:false,combo:false,dir:"read",q:null,picked:null,run:0};
  dv={lesson:S.set.lesson,mixed:false,drill:null};
}
resetSessions();
function queue(){
  if(!cs.queue||cs.day!==dayNow()){const c=counts(cs.extra);cs.queue=[...c.due,...c.fresh].map(c=>c.id);cs.day=dayNow();cs.shown=false;}
  return cs.queue;
}

const $=id=>document.getElementById(id);
const view=$("view");
const TABS=["learn","kana","kanji","quiz","drill","progress"];
const route=()=>{const h=location.hash.slice(1);return TABS.includes(h)?h:"learn";};
function render(){
  const r=route();animTok++;
  document.querySelectorAll("nav a").forEach(a=>{if(a.dataset.tab===r)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  $("sealN").textContent=streak();
  const writing=wr&&wr.from===r;
  view.innerHTML=writing?vWriter():({learn:vLearn,kana:vKana,kanji:vKanji,quiz:vQuiz,drill:vDrill,progress:vProgress})[r]();
  if(writing)initPad();
  showSync();
}
const head=(title,sub)=>`<div><h1>${title}</h1><p class="muted small">${sub}</p></div>`;
const opt=(v,label,sel)=>`<option value="${v}" ${sel?"selected":""}>${label}</option>`;
function strokeSvg(ch,cls,nums,id){
  const st=STROKES[ch];if(!st)return "";
  return `<svg class="${cls}" ${id?`id="${id}"`:""} viewBox="0 0 109 109" aria-hidden="true">${st.map(d=>`<path d="${d}"/>`).join("")}${nums?st.map((d,i)=>{const p=/M\s*(-?[\d.]+)[ ,]\s*(-?[\d.]+)/.exec(d);return p?`<text x="${(+p[1]-4).toFixed(1)}" y="${(+p[2]-1.5).toFixed(1)}">${i+1}</text>`:"";}).join(""):""}</svg>`;
}
let animTok=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function play(id){
  const svg=$(id);if(!svg)return;const tok=++animTok,ps=[...svg.querySelectorAll("path")];
  const still=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  ps.forEach(p=>{const n=p.getTotalLength();p.style.strokeDasharray=n;p.style.strokeDashoffset=n;p.style.visibility="visible";});
  for(const p of ps){
    if(tok!==animTok||!p.isConnected)return;
    const n=p.getTotalLength();
    if(!still&&p.animate){try{await p.animate([{strokeDashoffset:n},{strokeDashoffset:0}],{duration:Math.max(280,n*9),easing:"ease-in-out"}).finished;}catch(e){return;}}
    p.style.strokeDashoffset=0;await wait(still?350:140);
  }
  await wait(1100);if(tok===animTok)ps.forEach(p=>{p.style.visibility="hidden";});
}

  <p class="muted small">Trace over the guide following the numbers, then hide it and write from memory. With a pen, pressure changes the line and your resting hand is ignored.</p>`;

let pad=null;
function initPad(){
  const cv=$("pad");if(!cv)return;
  const g=$("ghost");if(g)g.style.visibility=wr.guide?"":"hidden";
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);
  const ctx=cv.getContext("2d");if(!ctx)return;
  const W=cv.width,base=W/30,ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#14213d";
  ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=ink;
  const seg=(a,c)=>{ctx.lineWidth=base*(0.45+1.1*((a[2]+c[2])/2));ctx.beginPath();ctx.moveTo(a[0]*W,a[1]*W);ctx.lineTo(c[0]*W,c[1]*W);ctx.stroke();};
  const redraw=()=>{ctx.clearRect(0,0,W,W);for(const s of wr.strokes)for(let i=1;i<s.length;i++)seg(s[i-1],s[i]);};
  pad={redraw};redraw();
  let cur=null,pid=null;
  const pt=e=>{const q=cv.getBoundingClientRect();return [(e.clientX-q.left)/q.width,(e.clientY-q.top)/q.height,e.pointerType==="pen"&&e.pressure>0?Math.min(1,e.pressure):0.5];};
  cv.onpointerdown=e=>{
    if(e.pointerType==="pen")wr.pen=true;
    if(wr.pen&&e.pointerType==="touch")return;      // palm rejection once a pen has been used
    if(cur)return;
    pid=e.pointerId;try{cv.setPointerCapture(pid);}catch(_){}
    const p=pt(e);cur=[p,[p[0]+0.0005,p[1]+0.0005,p[2]]];wr.strokes.push(cur);seg(cur[0],cur[1]);e.preventDefault();
  };
  cv.onpointermove=e=>{
    if(!cur||e.pointerId!==pid)return;
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of (evs.length?evs:[e])){const p=pt(ev);seg(cur[cur.length-1],p);cur.push(p);}
  };
  cv.onpointerup=cv.onpointercancel=e=>{if(e.pointerId===pid){cur=null;pid=null;}};
}
function openWriter(list,i,from){wr={list,i,from,guide:true,strokes:[],pen:wr?wr.pen:false};}

    <button class="btn wide" data-act="writeAll" id="writeAllBtn">Writing practice with these kanji</button>${foot}`;
  }
  const c=CARD[q[0]],s=S.srs[c.id],pre=g=>fmt(grade(s,g,t).i),ex=c.ex.split(" ");
  return head("Kanji",`<span class="num">${q.length}</span> left today`)+
  `<div class="cell"><span class="tag">${s?"Review":"New"}</span><span class="stamp num">L${c.l}</span><span class="glyph" lang="ja" style="font-size:120px;line-height:1.1">${c.k}</span></div>
  ${cs.shown?`<div class="answer"><span class="kj" lang="ja">${c.read}${romaOn()?` <span class="muted" style="font-family:var(--ui);font-size:17px">${toRomaji(c.read)}</span>`:""}</span><span class="en">${c.en}</span><span lang="ja"><span class="jp" style="font-size:19px">${ex[0]}</span> <span class="muted">${ex[1]||""}${RP(ex[1]||"")} · ${ex.slice(2).join(" ")}</span></span>
    <div class="row" style="margin-top:6px"><div class="strokebox">${strokeSvg(c.k,"ghost",true)}${strokeSvg(c.k,"anim",false,"cardAnim")}</div><div class="stack"><button class="chip" data-act="playCard" id="playCardBtn">Show strokes</button><button class="chip" data-act="writeCard" id="writeCardBtn">Write it</button></div></div></div>
  <div class="grades">${[["Again","soon"],["Hard",pre(1)],["Good",pre(2)],["Easy",pre(3)]].map((x,g)=>`<button class="btn g${g}" data-act="grade" data-g="${g}" id="grade${g}">${x[0]}<small class="num">${x[1]}</small></button>`).join("")}</div>`
  :`<button class="btn primary wide" data-act="show" id="showBtn">Show answer</button><p class="muted small">Say the reading and meaning first, then check.</p>`}${foot}`;
}

/* Quiz: multiple choice on kana or kanji */
function quizPool(){
  if(qv.set==="kanji")return deck().map(k=>{const rd=k.read.split(" · ").slice(0,2).join(" · ");return {ch:k.k,ans:rd+" — "+k.en,ro:toRomaji(rd)};});
  const k=KANA[qv.set];
  return [...k.base,...(qv.voiced?k.voiced:[]),...(qv.combo?k.combo:[])].map(p=>({ch:p[0],ans:p[1]}));
}
function newQuizQ(){
  const pool=quizPool();if(pool.length<4){qv.q=null;return;}
  const w=pool.map(p=>{const s=S.cstat[p.ch]||{c:0,w:0};return Math.max(.3,1+2*s.w-.25*s.c);});
  let r=Math.random()*w.reduce((a,x)=>a+x,0),i=0;for(;i<pool.length-1;i++){r-=w[i];if(r<=0)break;}
  if(qv.q&&pool[i].ch===qv.q.ch)i=(i+1)%pool.length;
  const a=pool[i],wrong=[];
  for(const p of shuffle(pool)){if(p.ans!==a.ans&&p.ch!==a.ch&&!wrong.some(x=>x.ans===p.ans))wrong.push(p);if(wrong.length===3)break;}
  qv.q={ch:a.ch,ans:a.ans,o:shuffle([a,...wrong])};qv.picked=null;
}
function vQuiz(){
  const isK=qv.set==="kanji",find=qv.dir==="find";
  const top=head("Quiz",`Multiple choice · <span class="num">${qv.run}</span> correct in a row`)+
  `<div class="chips">${[["hira","Hiragana"],["kata","Katakana"],["kanji","Kanji"]].map(s=>`<button class="chip" data-act="qset" data-s="${s[0]}" id="qs-${s[0]}" aria-pressed="${qv.set===s[0]}">${s[1]}</button>`).join("")}</div>
  <div class="chips"><button class="chip" data-act="qdir" data-d="read" id="qd-read" aria-pressed="${!find}">Character → reading</button><button class="chip" data-act="qdir" data-d="find" id="qd-find" aria-pressed="${find}">Reading → character</button>
  ${isK?"":`<button class="chip jp" data-act="qvoiced" id="qvoicedBtn" aria-pressed="${qv.voiced}" aria-label="Include voiced kana" lang="ja">が ぱ</button><button class="chip jp" data-act="qcombo" id="qcomboBtn" aria-pressed="${qv.combo}" aria-label="Include combined kana" lang="ja">きゃ</button>`}</div>`;
  const pool=quizPool();
  if(pool.length<4)return top+`<p>Kanji start in lesson 3. Set your current lesson to 3 or later under <a href="#progress">Progress</a>.</p>`;
  if(!qv.q||!pool.some(p=>p.ch===qv.q.ch))newQuizQ();
  const q=qv.q,done=qv.picked!==null,solid=pool.filter(p=>{const s=S.cstat[p.ch];return s&&s.c>s.w;}).length;
  const cls=o=>done&&o.ch===q.ch?" right":done&&o.ch===qv.picked?" wrong":"";
  return top+`<div class="cell" style="min-height:${find?130:200}px"><span class="tag num">${solid} of ${pool.length} solid${isK?" · lessons 3 to "+S.set.lesson:""}</span>
    <span class="glyph" lang="ja" style="${find?`font-size:${isK?20:44}px;font-family:var(--ui);font-weight:700`:`font-size:${q.ch.length>1?84:116}px;line-height:1.1`}">${find?q.ans:q.ch}</span>${find&&isK&&romaOn()?`<span class="ro" style="position:relative">${q.o.find(o=>o.ch===q.ch).ro}</span>`:""}</div>
  <div class="opts${isK&&!find?" one":""}">${q.o.map((o,i)=>`<button class="opt${find?" big":""}${cls(o)}" data-act="qpick" data-i="${i}" id="qopt${i}" ${done?"disabled":""} lang="ja"${isK&&!find?' style="font-size:16px"':""}>${find?o.ch:o.ans}${!find&&isK&&romaOn()?`<span class="ro">${o.ro}</span>`:""}</button>`).join("")}</div>
  ${done?`<button class="btn primary wide" data-act="qnext" id="qnextBtn">Next</button>`:""}`;
}

/* Drill: grammar practice */
function newDrill(){
  const ls=dv.mixed?Object.keys(S.studied).map(Number):[dv.lesson];
  let pool=ls.flatMap(n=>LESSONS[n].quiz);
  if(ls.includes(3))pool.push(...shuffle(VERBS).slice(0,5).map((v,i)=>conjQuestion(v,i%2===1)));
  dv.drill={qs:shuffle(pool).slice(0,10).map(q=>q.t==="mc"?{...q,o:shuffle(q.o)}:{...q,pool:shuffle(q.tiles.map((w,i)=>({w,i}))),built:[]}),i:0,picked:null,score:0};
}
function vDrill(){
  const dr=dv.drill,nStud=Object.keys(S.studied).length;
  if(!dr){
    const g=S.gram[dv.lesson]||{c:0,w:0},tot=g.c+g.w;
    return head("Grammar drill","Ten questions: fill the gap or build the sentence")+
    `<label class="stack" for="dlesson"><h2>Lesson</h2><select id="dlesson" ${dv.mixed?"disabled":""}>${Object.keys(LESSONS).map(n=>opt(n,`${n} · ${LESSONS[n].title}`,+n===dv.lesson)).join("")}</select></label>
    <div class="chips"><button class="chip" data-act="mixed" id="mixedBtn" aria-pressed="${dv.mixed}" ${nStud?"":"disabled"}>Mix all studied lessons (${nStud})</button></div>
    <button class="btn primary wide" data-act="drill" id="drillBtn">Start drill</button>
    <p class="muted small num">${dv.mixed?"Questions come from every lesson you marked as studied.":tot?`${Math.round(g.c/tot*100)}% correct over ${tot} answers in lesson ${dv.lesson}`:`No answers yet in lesson ${dv.lesson}`}</p>
    ${dv.mixed?"":`<button class="btn wide" data-act="readNotes" id="readNotesBtn">Read the notes for lesson ${dv.lesson}</button>`}`;
  }
  if(dr.i>=dr.qs.length){
    return head("Grammar drill","Finished")+`<div class="cell"><span class="tag">Score</span><span class="glyph num" style="font-size:64px">${dr.score} / ${dr.qs.length}</span></div>
    <button class="btn primary wide" data-act="drill" id="againBtn">Another drill</button><button class="btn wide" data-act="endDrill" id="endBtn">Choose another lesson</button>`;
  }
  const q=dr.qs[dr.i],done=dr.picked!==null;
  let body;
  if(q.t==="mc"){
    body=`<div class="cell" style="min-height:140px"><span class="tag">Choose</span><span class="glyph" lang="ja" style="font-size:${q.q.length>26?19:q.q.length>16?23:29}px">${q.q}</span></div>${RO(q.q)}<p>${q.en}</p>
    <div class="opts${q.o.some(o=>o.length>9)?" one":""}">${q.o.map((o,i)=>`<button class="opt${/^[a-z(]/.test(o)?"":" jp"}${done&&o===q.a?" right":done&&o===dr.picked?" wrong":""}" data-act="pick" data-i="${i}" id="opt${i}" ${done?"disabled":""} lang="ja">${o}</button>`).join("")}</div>`;
  }else{
    const used=new Set(q.built.map(x=>x.i));
    body=`<p class="small muted">Build the sentence</p><p style="font-size:18px;font-weight:700">${q.en}</p>
    <div class="tiles slot" lang="ja">${q.built.map((x,k)=>`<button class="tile" data-act="untile" data-k="${k}" id="bt${k}" ${done?"disabled":""}>${x.w}${RO(x.w)}</button>`).join("")||`<span class="muted small">Tap the words in order</span>`}</div>
    <div class="tiles" lang="ja">${q.pool.filter(p=>!used.has(p.i)).map(p=>`<button class="tile" data-act="tile" data-i="${p.i}" id="pt${p.i}" ${done?"disabled":""}>${p.w}${RO(p.w)}</button>`).join("")}</div>
    ${done?"":`<button class="btn primary wide" data-act="check" id="checkBtn" ${q.built.length===q.tiles.length?"":"disabled"}>Check</button>`}`;
  }
  const ok=dr.picked===true||dr.picked===q.a;
  return head("Grammar drill",`Question <span class="num">${dr.i+1} of ${dr.qs.length}</span> · lesson ${q.n}`)+body+
  (done?`<div class="verdict ${ok?"ok":"no"}"><b>${ok?"Correct":"Not quite"}</b><span lang="ja">${q.t==="mc"?(ok?"":"Answer: "+q.a+RP(q.a)+". ")+q.why:(ok?"":"Answer: ")+q.tiles.join(" ")+RO(q.tiles.join(" "))}</span></div><button class="btn primary wide" data-act="next" id="nextBtn">Next</button>`:"")+
  `<button class="chip" data-act="endDrill" id="quitBtn" style="align-self:flex-start">Leave drill</button>`;
}

/* Progress: today, week, roadmap, settings */
function vProgress(){
  const t=dayNow(),d=peek(t),c=counts(),q=cs.queue&&cs.day===t?cs.queue.length:c.due.length+c.fresh.length;
  const kj=learned(),done=Object.keys(S.studied).length,cardsDone=q===0&&S.set.lesson>=3;
  const task=(href,ok,title,sub,pct,go)=>`<a class="task${ok?" done":""}" href="${href}"><span class="tick">✓</span><span class="grow"><strong>${title}</strong><span class="muted small num">${sub}</span>${pct==null?"":`<span class="bar"><i style="width:${Math.min(100,pct)}%"></i></span>`}</span><span class="go">${ok?"Done":go}</span></a>`;
  const days=[...Array(7)].map((_,i)=>t-6+i),max=Math.max(1,...days.map(n=>total(peek(n))));
  const wk=days.map(n=>{const v=total(peek(n)),dt=new Date(n*864e5);return `<div class="${v?"":"zero"}${n===t?" now":""}"><span class="num">${v||""}</span><i style="height:${Math.round(v/max*56)}px"></i>${"SMTWTFS"[dt.getUTCDay()]}</div>`;}).join("");
  const here=S.set.lesson<=12?0:1;
  return head("Progress",new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+` · <span class="num">${streak()}</span> day streak`)+
  `<section class="stack"><h2>Today</h2>
    ${task("#kanji",cardsDone,"Kanji cards",S.set.lesson<3?"Start in lesson 3":cardsDone?`${d.r} reviews done today`:`${c.due.length} due · ${c.fresh.length} new`,null,"Review")}
    ${task("#drill",d.g>=10,"Grammar drill",`${Math.min(d.g,10)} of 10 answers`,d.g*10,"Practise")}
    ${task("#quiz",d.k>=20,"Kana and kanji quiz or writing",`${Math.min(d.k,20)} of 20 answers`,d.k*5,"Practise")}
  </section>
  <section class="card stack"><h2>Last 7 days · answers</h2><div class="week">${wk}</div></section>
  <section class="card stack"><h2>Road to working Japanese</h2>
    <p class="small num"><strong>${done} of ${NL}</strong> grammar lessons studied</p><div class="bar" style="margin:0"><i style="width:${done/NL*100}%"></i></div>
    <p class="small num"><strong>${kj} of ${KANJI.length}</strong> kanji learned</p><div class="bar" style="margin:0"><i style="width:${kj/KANJI.length*100}%"></i></div>
    <ol class="road">${STAGES.map((s,i)=>`<li class="${i===here?"here":""}"><span class="lv" lang="ja">${s[0]}</span><div><strong>${i===here?"You are here · ":""}${i===4?"Professional":"JLPT "+s[0]}</strong><span class="small">${s[1]}</span><br><span class="small muted">${s[2]}</span></div></li>`).join("")}</ol>
  </section>
  <section class="card set"><h2 style="margin-bottom:6px">Settings</h2>
    <label for="lesson"><span><strong>Current lesson</strong><br><span class="small muted">Unlocks kanji up to this lesson</span></span><select id="lesson">${[...Array(NL)].map((_,i)=>opt(i+1,`${book(i+1)} · L${i+1}`,i+1===S.set.lesson)).join("")}</select></label>
    <label for="romaji"><span><strong>Show romaji</strong><br><span class="small muted">Under Japanese in lessons, kanji and drills</span></span><input type="checkbox" id="romaji" ${romaOn()?"checked":""}></label>
    <label for="npd"><span><strong>New kanji per day</strong></span><select id="npd">${[3,5,8,10,15].map(n=>opt(n,n,S.set.npd===n)).join("")}</select></label>
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;padding-top:10px;border-top:1px dashed var(--line)"><span id="sync" class="sync">Progress saved on this device only</span><button class="chip" data-act="reset" id="resetBtn">Reset progress</button></div>
    ${PWA?`<div class="row" style="flex-wrap:wrap;padding-top:10px"><button class="chip" data-act="export" id="exportBtn">Export backup</button><button class="chip" data-act="import" id="importBtn">Import backup</button><span class="small muted" id="backupMsg"></span><input type="file" id="importFile" accept="application/json,.json" hidden></div>`:""}
  </section>
  <p class="muted small">Lesson order and kanji selection follow Genki I and II (3rd edition); explanations, examples and exercises are written for this app. Stroke order diagrams: KanjiVG by Ulrich Apel, CC BY-SA 3.0.</p>`;
}

/* ---------- Actions ---------- */
let confirmReset=false;
const toTop=()=>{view.scrollTop=0;};
const ACT={
  openLesson(el){lv.open=+el.dataset.n;render();toTop();},
  closeLesson(){const n=lv.open;lv.open=null;render();const e=$("lesson"+n);if(e)e.scrollIntoView({block:"center"});},
  practise(){dv.lesson=lv.open;dv.mixed=false;newDrill();location.hash="#drill";},
  toggleRomaji(){S.set.romaji=!romaOn();save();render();},
  studied(){const n=lv.open;if(S.studied[n])delete S.studied[n];else{S.studied[n]=1;if(n>=S.set.lesson&&n<NL){S.set.lesson=n+1;cs.queue=null;}}save();render();},
  setCurrent(){S.set.lesson=lv.open;cs.queue=null;save();render();},
  kset(el){kv.set=el.dataset.s;render();},
  write(el){const list=kanaList(),i=list.findIndex(p=>p[0]===el.dataset.ch);openWriter(list.map(p=>[p[0],p[0]+"  ·  "+p[1]]),Math.max(0,i),"kana");render();toTop();},
  closeWriter(){wr=null;render();},
  playPad(){play("padAnim");},
  undo(){wr.strokes.pop();if(pad)pad.redraw();},
  clear(){wr.strokes=[];if(pad)pad.redraw();},
  ghost(){wr.guide=!wr.guide;$("ghost").style.visibility=wr.guide?"":"hidden";$("ghostBtn").textContent=wr.guide?"Hide guide":"Show guide";},
  wnext(){if(wr.strokes.length){D().k++;save();}wr.i=(wr.i+1)%wr.list.length;wr.strokes=[];render();},
  wprev(){wr.i=(wr.i-1+wr.list.length)%wr.list.length;wr.strokes=[];render();},
  show(){cs.shown=true;render();},
  playCard(){play("cardAnim");},
  writeCard(){const c=CARD[queue()[0]];openWriter([[c.k,c.read+" — "+c.en]],0,"kanji");render();toTop();},
  writeAll(){const l=deck().filter(c=>S.srs[c.id]);const src=l.length?l:deck();openWriter(src.map(c=>[c.k,c.read+" — "+c.en]),0,"kanji");render();toTop();},
  grade(el){
    const g=+el.dataset.g,q=queue(),id=q.shift(),t=dayNow(),d=D(t);
    if(!S.srs[id])d.n++;
    S.srs[id]=grade(S.srs[id],g,t);d.r++;
    if(g===0)q.splice(Math.min(q.length,3),0,id);
    cs.shown=false;save();render();toTop();
  },
  more(){cs.extra+=5;cs.queue=null;render();},
  qset(el){qv.set=el.dataset.s;qv.q=null;render();},
  qdir(el){qv.dir=el.dataset.d;qv.picked=null;newQuizQ();render();},
  qvoiced(){qv.voiced=!qv.voiced;qv.q=null;render();},
  qcombo(){qv.combo=!qv.combo;qv.q=null;render();},
  qpick(el){
    const q=qv.q,o=q.o[+el.dataset.i];qv.picked=o.ch;const ok=o.ch===q.ch,s=S.cstat[q.ch]||(S.cstat[q.ch]={c:0,w:0});
    ok?(s.c++,qv.run++):(s.w++,qv.run=0);D().k++;save();render();
  },
  qnext(){newQuizQ();render();},
  mixed(){dv.mixed=!dv.mixed;render();},
  drill(){newDrill();render();toTop();},
  endDrill(){dv.drill=null;render();},
  readNotes(){lv.open=dv.lesson;location.hash="#learn";},
  pick(el){const dr=dv.drill,q=dr.qs[dr.i];dr.picked=q.o[+el.dataset.i];gradeGrammar(dr.picked===q.a);},
  tile(el){const q=dv.drill.qs[dv.drill.i];q.built.push(q.pool.find(p=>p.i===+el.dataset.i));render();},
  untile(el){dv.drill.qs[dv.drill.i].built.splice(+el.dataset.k,1);render();},
  check(){const dr=dv.drill,q=dr.qs[dr.i],got=q.built.map(x=>x.w).join("|");const ok=[q.tiles,...q.alt].some(a=>a.join("|")===got);dr.picked=ok;gradeGrammar(ok);},
  next(){dv.drill.i++;dv.drill.picked=null;render();toTop();},
  export(){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));
    a.download="kotsukotsu-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    $("backupMsg").textContent="Backup file downloaded.";
  },
  import(){$("importFile").click();},
  reset(el){
    if(!confirmReset){confirmReset=true;el.textContent="Tap again to erase everything";setTimeout(()=>{confirmReset=false;if(el.isConnected)el.textContent="Reset progress";},4000);return;}
    confirmReset=false;S=blank();resetSessions();save();render();
  }
};
function gradeGrammar(ok){const dr=dv.drill,n=dr.qs[dr.i].n,g=S.gram[n]||(S.gram[n]={c:0,w:0});ok?(g.c++,dr.score++):g.w++;D().g++;save();render();}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&!el.disabled&&ACT[el.dataset.act])ACT[el.dataset.act](el);});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="importFile"){
    const f=el.files[0];if(!f)return;
    f.text().then(txt=>{
      const data=JSON.parse(txt);
      if(!data||typeof data.srs!=="object"||typeof data.days!=="object")throw new Error("bad file");
      S=norm(data);resetSessions();save();render();$("backupMsg").textContent="Backup restored.";
    }).catch(()=>{$("backupMsg").textContent="That file is not a Kotsukotsu backup.";});
  }
  else if(el.id==="lesson"){S.set.lesson=+el.value;cs.queue=null;dv.lesson=S.set.lesson;save();render();}
  else if(el.id==="romaji"){S.set.romaji=el.checked;save();render();}
  else if(el.id==="npd"){S.set.npd=+el.value;cs.queue=null;save();render();}
  else if(el.id==="dlesson"){dv.lesson=+el.value;render();}
});
window.addEventListener("hashchange",()=>{render();toTop();});
let rz=null;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(wr&&wr.from===route())initPad();},200);});
render();
initSync();
if(PWA){
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
</script>
</body>
